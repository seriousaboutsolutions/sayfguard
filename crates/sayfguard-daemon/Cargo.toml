[package]
name = "sayfguard-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evidence-preservation daemon: lease-gated sequestration and time-boxed retention for data directories that must never be silently overwritten."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

